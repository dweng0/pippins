services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stackcx}
      POSTGRES_USER: ${POSTGRES_USER:-stackcx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackcx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stackcx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  tailwind:
    build: .
    command: tailwindcss-extra -i assets/input.css -o static/css/app.css --watch=always
    volumes:
      - .:/app

volumes:
  postgres_data:
