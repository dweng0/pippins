name: CI

on:
  push:
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: ci-test-key
  POSTGRES_HOST: localhost
  POSTGRES_DB: stackcx
  POSTGRES_USER: stackcx
  POSTGRES_PASSWORD: stackcx
  REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stackcx
          POSTGRES_USER: stackcx
          POSTGRES_PASSWORD: stackcx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit / integration tests
        run: pytest

  e2e:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stackcx
          POSTGRES_USER: stackcx
          POSTGRES_PASSWORD: stackcx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python manage.py migrate --noinput

      - run: python manage.py load_tracks

      - name: Build CSS
        run: tailwindcss-extra -i assets/input.css -o static/css/app.css --minify

      - name: Start Django
        run: python manage.py runserver 8000 --noreload &

      - name: Wait for app
        run: npx --yes wait-on http://localhost:8000/healthz/ --timeout 60000

      - uses: cypress-io/github-action@v6
        with:
          wait-on: http://localhost:8000/healthz/
        env:
          CYPRESS_BASE_URL: http://localhost:8000

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
