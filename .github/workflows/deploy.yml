name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH deploy (pull + restart stack)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            git pull
            docker-compose up -d --build

  # Terraform apply is deliberately NOT wired into this pipeline.
  # Infra changes (instance size, security group rules, etc.) are rare and
  # risky enough to want a human running `terraform plan` and reading the
  # diff before `apply` — see infra/README.md. This job only ships app code
  # to the box Terraform already created.
