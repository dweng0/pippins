# Production override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    ports: !reset []
    restart: unless-stopped

  web:
    # collectstatic already ran in the image build; covers load_tracks extracts are committed
    # (test_every_embedded_cover_is_committed). prune_listeners on each deploy bounds Listener/session growth.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py load_tracks &&
             python manage.py prune_listeners &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --worker-class gthread --threads 4"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes: !reset []
    ports: !override
      - "80:8000"
    restart: unless-stopped

  # dev-only CSS watcher; prod serves the CSS built into the image
  tailwind:
    profiles: ["dev-only"]
