{% load static django_htmx %}<!doctype html>
{# Site shell only: head, CSS, htmx/Alpine. Feature apps fill body/scripts (the player: player/layout.html). #}
<html lang="en" data-theme="pippins">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pippins{% endblock %}</title>
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
  <link rel="icon" href="{% static 'core/pippins.svg' %}" type="image/svg+xml">
  <meta name="htmx-config" content='{"historyCacheSize": 0}'>
</head>
<body class="min-h-screen bg-base-100 text-base-content" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
{% block body %}{% endblock %}

  {% block scripts %}{% endblock %}
  {% htmx_script %}
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"
    integrity="sha384-5/joNqFnRyVWzXp99bHot6RHG+EksGp+USSgZwPar7T9SD9PKKER37n/8bXBAZGd" crossorigin="anonymous"></script>
</body>
</html>
