{% load static %}<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Project Poppins{% endblock %}</title>
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col bg-base-200">
  <nav class="navbar bg-neutral text-neutral-content">
    <div class="container mx-auto px-4">
      <a class="btn btn-ghost text-xl" href="{% url 'core:home' %}">Project Poppins</a>
    </div>
  </nav>

  <main class="container mx-auto px-4 py-8 flex-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="container mx-auto px-4 py-4 text-sm opacity-70 border-t border-base-300" data-cy="footer">
    Django · Postgres · Redis · deployed to AWS EC2 via CI-gated pipeline
  </footer>
</body>
</html>
